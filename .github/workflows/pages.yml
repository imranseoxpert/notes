# Publishes the web app (website + iPhone Home Screen app) to GitHub Pages on every push to main.
name: Website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Google sign-in keys (from the repository's Actions secrets)
        env:
          WEB_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          DESKTOP_ID: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          DESKTOP_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: |
          printf "window.NOTES_CONFIG = { googleWebClientId: '%s', googleDesktopClientId: '%s', googleDesktopClientSecret: '%s' };\n" \
            "$WEB_ID" "$DESKTOP_ID" "$DESKTOP_SECRET" > config.local.js
      - name: Build the web app
        run: bash webapp/build.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: webapp/build/notes-web
      - id: deployment
        uses: actions/deploy-pages@v4

# Builds the Mac and Windows apps when a version tag (v1.0.0, v1.1.0, ...) is pushed, and publishes them
# as a GitHub Release. The Google sign-in keys come from the repository's Actions secrets (never from the source),
# so the downloads open straight to "Continue with Google". Without those secrets, people add their own in the app.
#
# Windows and the web package build on Linux; only the Mac app needs a Mac. It uses an Intel Mac runner (still
# building for Apple silicon), because GitHub's Apple-silicon runners are often too busy to pick up the job.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to (re)build, e.g. v1.1.5'
        required: true
permissions:
  contents: write
env:
  TAG: ${{ inputs.tag || github.ref_name }}
jobs:
  windows-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Google sign-in keys (from the repository's Actions secrets)
        env:
          WEB_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          DESKTOP_ID: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          DESKTOP_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: |
          printf "window.NOTES_CONFIG = { googleWebClientId: '%s', googleDesktopClientId: '%s', googleDesktopClientSecret: '%s' };\n" \
            "$WEB_ID" "$DESKTOP_ID" "$DESKTOP_SECRET" > config.local.js
      - name: Windows app and installer
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq nsis
          bash winapp/build.sh
      - name: Web app
        run: bash webapp/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: windows-and-web
          path: |
            winapp/build/Notes-Setup-x64.exe
            winapp/build/Notes-Windows-x64.zip
            webapp/build/Notes-iPhone-Web.zip

  mac:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, macos-latest]    # either can sit unassigned for a long time: one success is enough
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Google sign-in keys (from the repository's Actions secrets)
        env:
          WEB_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          DESKTOP_ID: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          DESKTOP_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: |
          printf "window.NOTES_CONFIG = { googleWebClientId: '%s', googleDesktopClientId: '%s', googleDesktopClientSecret: '%s' };\n" \
            "$WEB_ID" "$DESKTOP_ID" "$DESKTOP_SECRET" > config.local.js
      - name: Mac app
        run: bash macapp/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.runner }}
          path: |
            macapp/build/Notes.dmg
            macapp/build/Notes-Mac.zip

  publish:
    needs: [windows-and-web, mac]
    if: ${{ always() && needs.windows-and-web.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! find out -type f -name 'Notes.dmg' | grep -q .; then echo "No Mac build succeeded, so nothing was published."; exit 1; fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "$TAG is already published."; exit 0; fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Notes $TAG" --generate-notes \
            $(find out -type f \( -name 'Notes.dmg' -o -name 'Notes-Mac.zip' -o -name 'Notes-Setup-x64.exe' -o -name 'Notes-Windows-x64.zip' -o -name 'Notes-iPhone-Web.zip' \))

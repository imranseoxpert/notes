name: Android Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Android project
        run: |
          curl -L -o android-project.zip https://github.com/imranseoxpert/notes/releases/download/android-src-v1/android-project.zip
          mkdir -p android
          unzip -q android-project.zip -d android

      - name: Restore signing keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: echo "$KS_B64" | base64 -d > android/android.keystore

      - name: Build unsigned APK and AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Sign APK and AAB
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk app-release-aligned.apk
          "$ANDROID_HOME/build-tools/$BT/apksigner" sign --ks android/android.keystore --ks-pass env:KS_PASS --key-pass env:KEY_PASS --ks-key-alias notes --out Notes-Android.apk app-release-aligned.apk
          cp android/app/build/outputs/bundle/release/app-release.aab Notes-Android.aab
          jarsigner -keystore android/android.keystore -storepass "$KS_PASS" -keypass "$KEY_PASS" -sigalg SHA256withRSA -digestalg SHA-256 Notes-Android.aab notes

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Notes-Android
          path: |
            Notes-Android.apk
            Notes-Android.aab
